<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA Live Stream - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #111 0%, #0a2e1a 100%);
            padding: 20px;
            border-bottom: 2px solid #00ff88;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: #00ff88;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            width: 250px;
        }

        .search-box:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn:hover {
            background: #00cc6a;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .btn-outline:hover {
            background: #00ff88;
            color: #000;
        }

        .subscribers-table {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .table-header {
            background: #1a1a1a;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 180px 120px 100px;
            gap: 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ff88;
            border-bottom: 1px solid #333;
        }

        .table-row {
            padding: 15px 20px;
            display: grid;
            grid-template-columns: 1fr 180px 120px 100px;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid #222;
            transition: background 0.3s;
        }

        .table-row:hover {
            background: #1a1a1a;
        }

        .email {
            color: #fff;
            font-weight: 500;
        }

        .timestamp {
            color: #888;
            font-size: 14px;
        }

        .source {
            color: #888;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-small:hover {
            background: #00ff88;
            color: #000;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .table-header,
            .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>LA Live Stream - Admin Dashboard</h1>
            <p>Email Subscribers Management</p>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalSubscribers">0</div>
                <div class="stat-label">Total Subscribers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todaySubscribers">0</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="weekSubscribers">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="monthSubscribers">0</div>
                <div class="stat-label">This Month</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="Search by email...">
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="exportToCSV()">Export CSV</button>
                <button class="btn btn-outline" onclick="testData()">Test Data</button>
                <button class="btn btn-outline" onclick="clearAll()">Clear All</button>
                <button class="btn btn-outline" onclick="refreshData()">Refresh</button>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="subscribers-table">
            <div class="table-header">
                <div>Email</div>
                <div>Date & Time</div>
                <div>Source</div>
                <div>Actions</div>
            </div>
            <div id="subscribersList">
                <div class="empty-state">
                    <h3>No subscribers yet</h3>
                    <p>When visitors sign up, they'll appear here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let subscribers = [];
        
        // Check if logged in
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSubscribers();
            setupSearch();
            updateStats();
            
            // Auto-refresh every 30 seconds
            setInterval(loadSubscribers, 30000);
        });

        function loadSubscribers() {
            console.log('Loading subscribers...');
            const stored = localStorage.getItem('laLiveStreamSubscribers');
            console.log('Raw data from localStorage:', stored);
            
            if (stored) {
                try {
                    subscribers = JSON.parse(stored);
                    console.log('Parsed subscribers:', subscribers);
                    console.log('Number of subscribers:', subscribers.length);
                } catch (e) {
                    console.error('Error parsing subscribers:', e);
                    subscribers = [];
                }
            } else {
                console.log('No data found in localStorage');
                subscribers = [];
            }
            renderSubscribers();
            updateStats();
        }

        function saveSubscribers() {
            localStorage.setItem('laLiveStreamSubscribers', JSON.stringify(subscribers));
        }

        function renderSubscribers(filteredList = null) {
            const list = filteredList || subscribers;
            const container = document.getElementById('subscribersList');
            
            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No subscribers found</h3>
                        <p>When visitors sign up, they'll appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map((subscriber, index) => `
                <div class="table-row">
                    <div class="email">${subscriber.email}</div>
                    <div class="timestamp">${subscriber.timestamp}</div>
                    <div class="source">${subscriber.source || 'Website'}</div>
                    <div class="actions">
                        <button class="btn-small" onclick="copyEmail('${subscriber.email}')">Copy</button>
                        <button class="btn-small" onclick="removeSubscriber(${index})">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);

            const todayCount = subscribers.filter(s => new Date(s.timestamp) >= today).length;
            const weekCount = subscribers.filter(s => new Date(s.timestamp) >= weekAgo).length;
            const monthCount = subscribers.filter(s => new Date(s.timestamp) >= monthAgo).length;

            document.getElementById('totalSubscribers').textContent = subscribers.length;
            document.getElementById('todaySubscribers').textContent = todayCount;
            document.getElementById('weekSubscribers').textContent = weekCount;
            document.getElementById('monthSubscribers').textContent = monthCount;
        }

        function setupSearch() {
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const filtered = subscribers.filter(s => 
                    s.email.toLowerCase().includes(query)
                );
                renderSubscribers(filtered);
            });
        }

        function copyEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                // Simple feedback
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1000);
            });
        }

        function removeSubscriber(index) {
            if (confirm('Are you sure you want to remove this subscriber?')) {
                subscribers.splice(index, 1);
                saveSubscribers();
                renderSubscribers();
                updateStats();
            }
        }

        function exportToCSV() {
            if (subscribers.length === 0) {
                alert('No subscribers to export');
                return;
            }

            const headers = ['Email', 'Timestamp', 'Source'];
            const csvContent = [
                headers.join(','),
                ...subscribers.map(s => [
                    s.email,
                    s.timestamp,
                    s.source || 'Website'
                ].join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `la-live-stream-subscribers-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all subscribers? This cannot be undone.')) {
                subscribers = [];
                saveSubscribers();
                renderSubscribers();
                updateStats();
            }
        }

        function refreshData() {
            loadSubscribers();
            // Visual feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Refreshed!';
            btn.style.background = '#00ff88';
            btn.style.color = '#000';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
                btn.style.color = '';
            }, 1000);
        }

        function testData() {
            const stored = localStorage.getItem('laLiveStreamSubscribers');
            alert('Raw data: ' + stored);
            console.log('Full localStorage data:', stored);
            
            // Add test subscriber
            const testEmail = 'test@example.com';
            const subscribers = JSON.parse(stored || '[]');
            subscribers.push({
                email: testEmail,
                timestamp: new Date().toLocaleString(),
                source: 'Test',
                id: Date.now()
            });
            localStorage.setItem('laLiveStreamSubscribers', JSON.stringify(subscribers));
            loadSubscribers();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminLoggedIn');
                window.location.href = 'login.html';
            }
        }

        // Listen for new subscribers (from main site)
        window.addEventListener('storage', function(e) {
            if (e.key === 'laLiveStreamSubscribers') {
                loadSubscribers();
            }
        });
    </script>
</body>
</html>
